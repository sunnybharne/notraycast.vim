name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          version: stable

      - name: Run smoke test
        run: nvim --headless -u NONE -l scripts/smoke-test.lua
