name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Run smoke test
        run: nvim --headless -u NONE -l scripts/smoke-test.lua

      - name: Install UI test dependencies
        run: |
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim.git .dependencies/plenary.nvim
          git clone --depth 1 https://github.com/nvim-telescope/telescope.nvim.git .dependencies/telescope.nvim

      - name: Run UI test
        run: >-
          nvim --headless -u NONE
          --cmd "set runtimepath+=${GITHUB_WORKSPACE}/.dependencies/plenary.nvim"
          --cmd "set runtimepath+=${GITHUB_WORKSPACE}/.dependencies/telescope.nvim"
          -l scripts/ui-test.lua
